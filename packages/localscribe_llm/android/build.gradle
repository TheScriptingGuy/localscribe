// Builds src/CMakeLists.txt (llama.cpp + the LocalScribe bridge) with the
// Android NDK into liblocalscribe_llm.so, which Dart opens via FFI.

group = "ai.localscribe.llm"
version = "0.1"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.0")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "ai.localscribe.llm"
    }

    compileSdk = 35
    ndkVersion = android.ndkVersion

    defaultConfig {
        minSdk = 24
        externalNativeBuild {
            cmake {
                // AGP builds release libraries as RelWithDebInfo; llama.cpp
                // needs full optimisation to be usable on a phone.
                arguments "-DCMAKE_BUILD_TYPE=Release", "-DANDROID_STL=c++_static"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path = "../src/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}
