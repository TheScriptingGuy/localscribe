name: build-apk

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Materialize Android platform files
        # The android/ folder is not committed; flutter create regenerates it
        # from pubspec.yaml + lib/ without touching our Dart sources or assets.
        # It also drops a counter-app test/widget_test.dart, which we remove.
        run: |
          flutter create --platforms=android --org ai.localscribe --project-name localscribe .
          rm -f test/widget_test.dart

      - name: Apply app manifest (permissions)
        run: cp ci/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Raise minSdk for BLE / audio
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts || true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: localscribe-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
