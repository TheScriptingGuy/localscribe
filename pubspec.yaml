name: localscribe
description: Local-first voice recording, transcription and AI notes. No cloud lock-in.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State / DI
  provider: ^6.1.2

  # Networking (remote AI API URLs)
  dio: ^5.4.0

  # Persistence
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  sqflite: ^2.3.2

  # Audio
  record: ^7.1.2
  just_audio: ^0.10.6
  file_picker: ^13.3.1
  flutter_foreground_task: ^11.0.3 # keeps mic recording alive in background

  # On-device transcription: whisper.cpp + MediaCodec decoding via FFI
  localscribe_native:
    path: packages/localscribe_native
  # On-device AI notes and Ask-AI (llama.cpp).
  localscribe_llm:
    path: packages/localscribe_llm

  # On-device speaker recognition (pyannote segmentation + speaker
  # embeddings). Pinned: local_diarizer.dart uses its FFI bindings directly.
  sherpa_onnx: 2.0.1
  ffi: ^2.1.0

  # BLE (Plaud device, Phase 5). flutter_reactive_ble is Apache-2.0 (FOSS),
  # unlike flutter_blue_plus 1.x (compileSdk 33) / 2.x (non-free license).
  # Pinned 5.2.0: 5.3.1's reactive_ble_mobile requires compileSdk 37 (an
  # unreleased platform); 5.2.0 builds against the stable SDK.
  flutter_reactive_ble: 5.2.0
  permission_handler: ^11.3.1
  # RSA PEM parsing for the imported Plaud key (thin wrapper over pointycastle).
  basic_utils: ^5.7.0

  # Crypto (BLE handshake + general)
  pointycastle: ^3.7.4
  crypto: ^3.0.3
  convert: ^3.1.1

  # Misc
  uuid: ^4.3.3
  intl: ^0.20.2
  http: ^1.2.0
  path: ^1.9.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/templates/
